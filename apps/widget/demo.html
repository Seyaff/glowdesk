<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your AI front desk — demo</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#faf7f5;color:#1f2937}
    .wrap{max-width:640px;margin:0 auto;padding:64px 24px}
    h1{font-size:28px;margin:0 0 12px}
    p{line-height:1.6;color:#4b5563}
    .hint{margin-top:32px;padding:16px;border-radius:12px;background:#fff;border:1px solid #eee}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Your website's AI front desk</h1>
    <p>This assistant was trained on your website. It answers visitor questions 24/7 and collects leads while your team is busy.</p>
    <div class="hint">👉 Click the chat button in the bottom-right corner and ask about your treatments, pricing or hours.</div>
  </div>
  <script src="/bx.js" defer></script>
</body>
</html>
